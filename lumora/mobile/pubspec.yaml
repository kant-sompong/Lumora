name: lumora_mobile
description: Lumora for phones - the Movies & TV tab, shrunk to a phone.
publish_to: "none"
version: 0.6.29+3

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  webview_flutter: ^4.10.0
  # Used directly for the Android-only fullscreen and autoplay switches.
  webview_flutter_android: ^4.10.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
