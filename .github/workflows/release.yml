name: Build and release

# Every push to main and every pull request runs the tests and builds both
# packages, so a broken spec is found before a release.  Pushing a v* tag
# (for example v0.3.0) additionally publishes a GitHub release with the
# Windows zip and the Linux tarball attached.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Windows, real Qt)
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6-Essentials pillow pytest
      - name: Tag matches lgl.__version__
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $v = python -c "import lgl; print(lgl.__version__)"
          if ("v$v" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match lgl.__version__ $v"
          }
      - name: Run tests
        run: python -m pytest tests -q

  linux-tests:
    name: Tests (Linux, GTK)
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK for the system Python
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 python3-pytest
      - name: Compile everything
        run: python3 -m compileall -q lgl packaging tests
      - name: Run the core tests (no PySide6 on this runner)
        run: |
          python3 -m pytest tests -q \
            --ignore=tests/test_qt_smoke.py \
            --ignore=tests/test_qt_parity.py \
            --ignore=tests/test_qt_downloads.py \
            --ignore=tests/test_qt_archive.py
      - name: Import the GTK frontend
        run: python3 -c "import lgl.ui; print('lgl.ui imports on Linux')"

  windows:
    name: Windows portable zip
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 PySide6-WebEngine pillow pyinstaller
      - name: Build with PyInstaller
        run: python -m PyInstaller --noconfirm --clean packaging/windows/Lumora.spec
      - name: Smoke test the built exe (must still be running after 10 s)
        run: |
          $p = Start-Process -FilePath "dist\Lumora\Lumora.exe" -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "Lumora.exe exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
      - name: Check the embedded player is bundled
        run: |
          $found = Get-ChildItem -Path dist\Lumora -Recurse -Filter QtWebEngineProcess.exe
          if (-not $found) { throw "QtWebEngineProcess.exe is missing from the build" }
          $pak = Get-ChildItem -Path dist\Lumora -Recurse -Filter *.pak
          if (-not $pak) { throw "Qt WebEngine resources (*.pak) are missing from the build" }
      - name: Zip
        run: |
          Compress-Archive -Path dist\Lumora -DestinationPath "dist\Lumora-Windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Lumora
          path: dist/Lumora-Windows-x64.zip
      - name: Build the per-user installer
        run: |
          choco install innosetup --no-progress -y
          $v = python -c "import lgl; print(lgl.__version__)"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$v" "packaging\windows\Lumora.iss"
          if (-not (Test-Path "dist\Lumora-Setup-x64.exe")) { throw "The installer was not produced" }
      - uses: actions/upload-artifact@v4
        with:
          name: Lumora-setup
          path: dist/Lumora-Setup-x64.exe

  linux:
    name: Linux tarball
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build tarball
        run: sh packaging/linux/build-tarball.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: dist/Lumora-*-linux-*.tar.gz

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
