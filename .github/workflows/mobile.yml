name: Mobile

# This workflow needs the app on the same branch: every step runs with
# lumora/mobile as its working directory, so it fails on a commit that has the
# workflow but not the app.
on:
  push:
    paths:
      - "lumora/mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "lumora/mobile/**"
      - ".github/workflows/mobile.yml"

env:
  # One exact version, in one place. The app is written against the 3.35 stable
  # line, and a moving "stable" would change the analyzer results under us.
  FLUTTER_VERSION: "3.35.7"

jobs:
  checks:
    name: Analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lumora/mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # The goldens are pixel comparisons against PNGs rendered with the SDK
      # test font plus the reference machine's font fallback, so they only match
      # where they were generated. The tag is declared in dart_test.yaml.
      - name: Test
        run: flutter test --exclude-tags golden

  build-apk:
    name: Build release APK
    needs: checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lumora/mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lumora-mobile-apk
          path: lumora/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
