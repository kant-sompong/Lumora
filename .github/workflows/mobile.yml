name: Mobile

on:
  push:
    paths:
      - "lumora/mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "lumora/mobile/**"
      - ".github/workflows/mobile.yml"

jobs:
  mobile:
    name: Analyze, test, build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lumora/mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Pinned: the app is written against the 3.35 stable line, and a moving
      # "stable" would change the analyzer results under us.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lumora-mobile-apk
          path: lumora/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
